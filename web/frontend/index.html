<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaoBot — Interface owner</title>
    <!--
      Typographie de la charte : Outfit (display), IBM Plex Sans (UI),
      JetBrains Mono (technique). Chargées depuis Google Fonts, avec repli
      système déclaré dans les variables CSS : si la ressource est
      indisponible (hors ligne, réseau filtré), l'interface reste lisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
    <!-- Le logo remplace l'émoji générique : favicon, topbar et écran de connexion. -->
    <link rel="icon" type="image/png" href="/assets/logo-32.png" />
    <link rel="apple-touch-icon" href="/assets/logo-256.png" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="/assets/logo-64.png" alt="" width="32" height="32" /> <strong>NaoBot</strong> <span class="brand-sub">Interface owner</span></div>
      <div id="user-area" class="user-area"></div>
    </header>

    <main id="app" class="app">
      <!-- Écran non authentifié -->
      <section id="login-view" class="login-view hidden">
        <div class="login-card">
          <img class="login-logo" src="/assets/logo-256.png" alt="Logo NaoBot" width="72" height="72" />
          <h1>Interface NaoBot</h1>
          <p>Espace strictement réservé aux <strong>owners du bot</strong>.</p>
          <a class="btn btn-primary" href="/login">Se connecter avec Discord</a>
          <p id="login-error" class="login-error"></p>
        </div>
      </section>

      <!--
        Application authentifiée. La navigation et les pages sont construites
        dynamiquement à partir des modules découverts : aucune page n'est
        déclarée en dur ici, ajouter une section ne modifie pas ce fichier.
      -->
      <section id="dash-view" class="dash-view hidden">
        <nav class="tabs" id="tabs"></nav>
        <div class="panel" id="page"></div>
      </section>
    </main>

    <footer class="footer">NaoBot — interface owner · mises à jour en temps réel (SSE)</footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
