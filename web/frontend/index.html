<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaoBot — Interface owner</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-logo">🤖</span> <strong>NaoBot</strong> <span class="brand-sub">Interface owner</span></div>
      <div id="user-area" class="user-area"></div>
    </header>

    <main id="app" class="app">
      <!-- Écran non authentifié -->
      <section id="login-view" class="login-view hidden">
        <div class="login-card">
          <div class="login-logo">🤖</div>
          <h1>Interface NaoBot</h1>
          <p>Espace strictement réservé aux <strong>owners du bot</strong>.</p>
          <a class="btn btn-primary" href="/login">Se connecter avec Discord</a>
          <p id="login-error" class="login-error"></p>
        </div>
      </section>

      <!--
        Application authentifiée. La navigation et les pages sont construites
        dynamiquement à partir des modules découverts : aucune page n'est
        déclarée en dur ici, ajouter une section ne modifie pas ce fichier.
      -->
      <section id="dash-view" class="dash-view hidden">
        <nav class="tabs" id="tabs"></nav>
        <div class="panel" id="page"></div>
      </section>
    </main>

    <footer class="footer">NaoBot — interface owner · mises à jour en temps réel (SSE)</footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
